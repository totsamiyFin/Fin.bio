    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink-50: #fff0f5;
            --pink-100: #ffe4ec;
            --pink-200: #ffcce0;
            --pink-300: #ff99c2;
            --pink-400: #ff6b9d;
            --pink-500: #ff4081;
            --pink-600: #e91e63;
            --pink-700: #c2185b;
            --pink-800: #ad1457;
            --pink-900: #880e4f;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            background: 
                linear-gradient(135deg, rgba(26, 10, 20, 0.85) 0%, rgba(45, 16, 33, 0.85) 50%, rgba(26, 10, 20, 0.85) 100%),
                url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 64, 129, 0.15) 0%, transparent 70%);
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            animation: pulse 8s ease-in-out infinite;
        }

        .bg-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.1) 0%, transparent 70%);
            bottom: -150px;
            right: -100px;
            pointer-events: none;
            animation: pulse 10s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.8; transform: translateX(-50%) scale(1.1); }
        }

        .container {
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 1;
        }

        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
            padding: 3px;
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.4);
            animation: float 6s ease-in-out infinite;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d1021, #1a0a14);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: var(--pink-400);
            border: 2px solid var(--pink-400);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .username {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(255, 64, 129, 0.5);
        }

        .tagline {
            text-align: center;
            color: var(--pink-300);
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 64, 129, 0.2);
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 64, 129, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .link:hover {
            transform: translateX(8px);
            border-color: var(--pink-500);
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.2), inset 0 0 30px rgba(255, 64, 129, 0.05);
        }

        .link:hover::before {
            opacity: 1;
        }

        .link-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            color: white;
        }

        .link-telegram { background: linear-gradient(135deg, #0088cc, #00aaff); }
        .link-discord { background: linear-gradient(135deg, #5865F2, #7289da); }
        .link-twitch { background: linear-gradient(135deg, #9146ff, #772ce8); }
        .link-steam { background: linear-gradient(135deg, #1b2838, #2a475e); }
        .link-namemc { background: linear-gradient(135deg, #4CAF50, #2E7D32); }
        .link-roblox { background: linear-gradient(135deg, #E2231A, #B91C18); }
        .link-spotify { background: linear-gradient(135deg, #1DB954, #1ed760); }

        .link-text {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
        }

        .link-arrow {
            color: var(--pink-400);
            font-size: 14px;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s;
        }

        .link:hover .link-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .decorative {
            position: fixed;
            color: var(--pink-800);
            font-size: 24px;
            opacity: 0.1;
            pointer-events: none;
        }

        .d-1 { top: 20%; left: 10%; animation: rotate 20s linear infinite; }
        .d-2 { top: 60%; right: 15%; animation: rotate 15s linear infinite reverse; }
        .d-3 { bottom: 20%; left: 20%; animation: rotate 25s linear infinite; }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
