<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --pink-300: #ff99c2;
  --pink-400: #ff6b9d;
  --pink-500: #ff4081;
  --pink-600: #e91e63;
  --pink-800: #ad1457;
}

body {
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  background:
    linear-gradient(135deg, rgba(26,10,20,.85) 0%, rgba(45,16,33,.85) 50%, rgba(26,10,20,.85) 100%),
    url('background.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
  position: relative;
  overflow-x: hidden;
}

.bg-glow {
  position: fixed; width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,64,129,.15) 0%, transparent 70%);
  top: -200px; left: 50%; transform: translateX(-50%);
  pointer-events: none; animation: pulse 8s ease-in-out infinite;
}
.bg-glow-2 {
  position: fixed; width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,107,157,.1) 0%, transparent 70%);
  bottom: -150px; right: -100px; pointer-events: none;
  animation: pulse 10s ease-in-out infinite reverse;
}
@keyframes pulse {
  0%, 100% { opacity: .5; transform: translateX(-50%) scale(1); }
  50% { opacity: .8; transform: translateX(-50%) scale(1.1); }
}

.container { width: 100%; max-width: 480px; position: relative; z-index: 1; }
.head, .links { max-width: 360px; margin-left: auto; margin-right: auto; }

.avatar-wrapper { display: flex; justify-content: center; margin-bottom: 20px; }
.avatar {
  width: 120px; height: 120px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
  padding: 3px; box-shadow: 0 0 30px rgba(255,64,129,.4);
  animation: float 6s ease-in-out infinite;
  cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none;
}
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; pointer-events: none; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.username {
  text-align: center; font-size: 26px; font-weight: 700; color: #fff;
  margin-bottom: 6px; text-shadow: 0 0 20px rgba(255,64,129,.5);
}
.tagline {
  text-align: center; color: var(--pink-300); font-size: 13px;
  margin-bottom: 20px; font-weight: 300; letter-spacing: 1px;
}

.links { display: flex; flex-direction: column; gap: 10px; }
.link {
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,64,129,.2);
  border-radius: 12px; text-decoration: none; color: #fff;
  transition: all .3s cubic-bezier(.4,0,.2,1); position: relative; overflow: hidden;
}
.link::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,64,129,.1), transparent);
  opacity: 0; transition: opacity .3s;
}
.link:hover {
  transform: translateX(8px); border-color: var(--pink-500);
  box-shadow: 0 0 30px rgba(255,64,129,.2), inset 0 0 30px rgba(255,64,129,.05);
}
.link:hover::before { opacity: 1; }
.link-icon {
  width: 36px; height: 36px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; color: #fff;
}
.link-telegram { background: linear-gradient(135deg, #0088cc, #00aaff); }
.link-discord  { background: linear-gradient(135deg, #5865F2, #7289da); }
.link-twitch   { background: linear-gradient(135deg, #9146ff, #772ce8); }
.link-steam    { background: linear-gradient(135deg, #1b2838, #2a475e); }
.link-namemc   { background: linear-gradient(135deg, #4CAF50, #2E7D32); }
.link-roblox   { background: linear-gradient(135deg, #E2231A, #B91C18); }
.link-spotify  { background: linear-gradient(135deg, #1DB954, #1ed760); }
.link-text { flex: 1; font-size: 13px; font-weight: 500; }
.link-arrow { color: var(--pink-400); font-size: 14px; opacity: 0; transform: translateX(-10px); transition: all .3s; }
.link:hover .link-arrow { opacity: 1; transform: translateX(0); }

.decorative { position: fixed; color: var(--pink-800); font-size: 24px; opacity: .1; pointer-events: none; }
.d-1 { top: 20%; left: 10%; animation: rotate 20s linear infinite; }
.d-2 { top: 60%; right: 15%; animation: rotate 15s linear infinite reverse; }
.d-3 { bottom: 20%; left: 20%; animation: rotate 25s linear infinite; }
@keyframes rotate { to { transform: rotate(360deg); } }

/* ---------- плеер ---------- */
.player {
  margin-top: 18px; padding: 20px 22px 16px;
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,64,129,.2);
  border-radius: 18px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.p-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.p-title { color: #fff; font-size: 17px; font-weight: 600; }
.p-artist { color: var(--pink-300); font-size: 13px; font-weight: 300; margin-left: 6px; }
.p-time { color: rgba(255,255,255,.55); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

.p-bar {
  height: 22px; margin: 10px 0 8px; display: flex; align-items: center; cursor: pointer;
  touch-action: none;
}
.p-bar-track { width: 100%; height: 5px; border-radius: 5px; background: rgba(255,255,255,.12); position: relative; }
.p-bar-fill {
  position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 5px;
  background: linear-gradient(90deg, var(--pink-400), var(--pink-600));
  box-shadow: 0 0 10px rgba(255,64,129,.6);
}

.p-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.p-ctrls { display: flex; align-items: center; gap: 6px; }
.p-btn {
  width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent;
  color: rgba(255,255,255,.8); font-size: 16px; cursor: pointer; transition: color .2s, background .2s;
}
.p-btn:hover { color: var(--pink-400); }
.p-btn:focus-visible, .avatar:focus-visible, .p-bar:focus-visible { outline: 2px solid var(--pink-400); outline-offset: 2px; }
.p-play {
  width: 48px; height: 48px; color: #fff; font-size: 18px;
  background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
  box-shadow: 0 0 16px rgba(255,64,129,.35);
}
.p-play:hover { color: #fff; filter: brightness(1.1); }
.p-vol { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,.55); font-size: 14px; }
.p-vol input { width: 110px; accent-color: var(--pink-500); cursor: pointer; }

/* ---------- экран входа ---------- */
.gate {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; cursor: pointer;
  background: rgba(26,10,20,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--pink-300); font-size: 14px; font-weight: 300; letter-spacing: 1px;
  transition: opacity .6s ease, visibility .6s;
}
.gate i { font-size: 26px; color: var(--pink-400); text-shadow: 0 0 20px rgba(255,64,129,.7); animation: pulse2 2.4s ease-in-out infinite; }
.gate:focus-visible { outline: 2px solid var(--pink-400); outline-offset: -6px; }
.gate.hide { opacity: 0; visibility: hidden; }
@keyframes pulse2 { 0%, 100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }

@media (max-width: 420px) {
  .player { padding: 18px 16px 14px; }
  .p-vol input { width: 84px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="container">

  <div class="avatar-wrapper">
    <div class="avatar" id="avatar" role="button" tabindex="0" aria-label="Аватар">

  </div>

  <h1 class="username">Fin2282</h1>

  </div>

  <div class="links">

<audio id="music" preload="auto"></audio>

<script>
/* ===== Музыка ===== */
const TRACKS = [
  { title: 'Safe Room',            artist: 'nicopatty',  src: 'safe-room.mp3' },
  { title: 'Shop',                 artist: 'nicopatty',  src: 'shop.mp3' },
  { title: 'Dead Internet Theory', artist: 'ZWE1HVNDXR', src: 'dead-internet-theory.mp3' }
];
const START_VOLUME = 0.1; // тихий фон при входе (0–1)

const music = document.getElementById('music');
const $ = id => document.getElementById(id);
let idx = 0;

music.volume = START_VOLUME;
$('pVol').value = START_VOLUME;

function fmt(s) {
  if (!isFinite(s)) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}
function loadTrack(i, autoplay) {
  idx = (i + TRACKS.length) % TRACKS.length;
  const t = TRACKS[idx];
  music.src = t.src;
  $('pTitle').textContent = t.title;
  $('pArtist').textContent = t.artist;
  $('pCur').textContent = '0:00';
  $('pDur').textContent = '0:00';
  $('pFill').style.width = '0%';
  if (autoplay) music.play().catch(() => {});
}
function setPlayIcon() {
  $('pPlayIcon').className = music.paused ? 'fas fa-play' : 'fas fa-pause';
}

$('pPlay').onclick = () => (music.paused ? music.play().catch(() => {}) : music.pause());
$('pPrev').onclick = () => loadTrack(idx - 1, true);
$('pNext').onclick = () => loadTrack(idx + 1, true);
$('pVol').oninput = e => { music.volume = +e.target.value; };

music.addEventListener('play', setPlayIcon);
music.addEventListener('pause', setPlayIcon);
music.addEventListener('ended', () => loadTrack(idx + 1, true));
music.addEventListener('loadedmetadata', () => { $('pDur').textContent = fmt(music.duration); });
music.addEventListener('timeupdate', () => {
  const p = music.duration ? (music.currentTime / music.duration) * 100 : 0;
  $('pFill').style.width = p + '%';
  $('pBar').setAttribute('aria-valuenow', Math.round(p));
  $('pCur').textContent = fmt(music.currentTime);
});

function seekFromEvent(e) {
  const r = $('pBar').getBoundingClientRect();
  const x = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  if (music.duration) music.currentTime = x * music.duration;
}
let dragging = false;
$('pBar').addEventListener('pointerdown', e => { dragging = true; seekFromEvent(e); });
window.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
window.addEventListener('pointerup', () => { dragging = false; });
$('pBar').addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') music.currentTime = Math.min(music.currentTime + 5, music.duration || 0);
  if (e.key === 'ArrowLeft') music.currentTime = Math.max(music.currentTime - 5, 0);
});

loadTrack(0, false);

/* ===== Мяу без задержки (Web Audio) ===== */
const AC = window.AudioContext || window.webkitAudioContext;
const ctx = new AC();
let meowBuf = null;
let meowStart = 0;
const fallback = new Audio('meowrgh.mp3');
fallback.preload = 'auto';

fetch('meowrgh.mp3')
  .then(r => r.arrayBuffer())
  .then(ab => ctx.decodeAudioData(ab))
  .then(buf => {
    meowBuf = buf;
    // убираем тишину в начале файла, чтобы звук стартовал сразу
    const d = buf.getChannelData(0);
    let i = 0;
    while (i < d.length && Math.abs(d[i]) < 0.01) i++;
    meowStart = Math.max(0, i - buf.sampleRate * 0.005) / buf.sampleRate;
  })
  .catch(() => {});

function meow() {
  if (ctx.state === 'suspended') ctx.resume();
  if (meowBuf) {
    const src = ctx.createBufferSource();
    src.buffer = meowBuf;
    src.connect(ctx.destination);
    src.start(0, meowStart);
  } else {
    fallback.currentTime = 0;
    fallback.play().catch(() => {});
  }
}
const avatar = $('avatar');
avatar.addEventListener('pointerdown', meow);
avatar.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); meow(); } });

/* ===== Вход на сайт: клик запускает музыку ===== */
const gate = $('gate');
function enter() {
  if (ctx.state === 'suspended') ctx.resume();
  music.muted = false;
  music.play().catch(() => {});
  gate.classList.add('hide');
}
gate.addEventListener('pointerdown', enter, { once: true });
gate.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });
</script>
