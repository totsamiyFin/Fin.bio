<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14060e">
<title>Fin2282</title>
<meta property="og:title" content="Fin2282">
<meta property="og:description" content="Добро пожаловать :3">
<meta property="og:image" content="avatar.jpg">
<link rel="icon" href="avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#14060e;
  --pink:#ff4d94;
  --pink-soft:#ff9ac4;
  --violet:#9b5cff;
  --text:#fff5f9;
  --muted:rgba(255,245,249,.62);
  --glass:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.12);
}
html{scroll-behavior:smooth}
body{
  font-family:'Outfit',system-ui,sans-serif;
  color:var(--text);
  min-height:100vh;min-height:100dvh;
  background:
    linear-gradient(160deg,rgba(20,6,14,.88),rgba(38,10,34,.84) 55%,rgba(20,6,14,.92)),
    url('background.jpg') center/cover fixed;
  background-color:var(--bg);
  display:flex;justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  overflow-x:hidden;
}
/* живой фон */
.blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;opacity:.5}
.b1{width:340px;height:340px;background:var(--pink);top:-110px;left:-90px;animation:drift 16s ease-in-out infinite alternate}
.b2{width:300px;height:300px;background:var(--violet);bottom:-100px;right:-80px;animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,50px) scale(1.15)}}

/* заставка */
.splash{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:rgba(20,6,14,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  cursor:pointer;border:0;color:var(--text);font:inherit;width:100%;
  transition:opacity .6s ease,visibility .6s;
}
.splash.hide{opacity:0;visibility:hidden}
.splash-star{font-size:44px;color:var(--pink);animation:spin 6s linear infinite;text-shadow:0 0 30px var(--pink)}
.splash-text{font-size:18px;font-weight:300;letter-spacing:.5px;animation:blink 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.35}}

/* страница */
.wrap{position:relative;z-index:1;width:100%;max-width:440px;align-self:flex-start;margin:auto}
.profile{text-align:center;margin-bottom:26px}
.avatar-btn{
  position:relative;display:inline-block;border:0;background:none;cursor:pointer;
  width:132px;height:132px;border-radius:50%;
  transition:transform .25s cubic-bezier(.3,1.6,.5,1);
}
.avatar-btn:active{transform:scale(.92) rotate(-4deg)}
.avatar-btn::before{
  content:'';position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--pink),var(--violet),var(--pink-soft),var(--pink));
  animation:spin 7s linear infinite;
}
.avatar-btn::after{content:'';position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 44px rgba(255,77,148,.45);pointer-events:none}
.avatar-btn img{
  position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;
  border:4px solid var(--bg);display:block;
}
.badge{
  position:absolute;z-index:2;right:-6px;bottom:2px;
  min-width:34px;padding:4px 9px;border-radius:99px;
  background:linear-gradient(135deg,var(--pink),var(--violet));
  font-size:13px;font-weight:600;color:#fff;border:3px solid var(--bg);
  transition:transform .2s;
}
.badge.pop{transform:scale(1.35)}
.meow{
  position:absolute;z-index:3;left:50%;top:10px;pointer-events:none;
  font-weight:800;font-size:20px;color:var(--pink-soft);text-shadow:0 0 14px var(--pink);
  animation:rise .9s ease-out forwards;
}
@keyframes rise{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-70px) scale(1.2)}}

h1{margin-top:18px;font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.tagline{margin-top:8px;height:24px;color:var(--pink-soft);font-weight:300;font-size:16px}
.tagline::after{content:'';display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-2px;background:var(--pink);animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.hint{margin-top:6px;font-size:12px;color:var(--muted)}

/* плитки */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:22px;
  min-height:112px;padding:16px;border-radius:22px;text-decoration:none;color:var(--text);
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow:hidden;isolation:isolate;
  transition:transform .2s ease,border-color .2s ease;
}
.tile::before{
  content:'';position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;
  background:radial-gradient(180px circle at var(--x,50%) var(--y,50%),rgba(255,77,148,.28),transparent 70%);
}
.tile:active{transform:scale(.96)}
.tile:focus-visible,.avatar-btn:focus-visible,.copy:focus-visible{outline:2px solid var(--pink-soft);outline-offset:3px}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:16px;padding:18px}
.ico{
  width:44px;height:44px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;
}
.name{font-size:16px;font-weight:600}
.sub{font-size:13px;color:var(--muted);font-weight:300}
.wide .name{font-size:18px}
.wide .go{margin-left:auto;color:var(--pink-soft)}
.tg{background:linear-gradient(135deg,#0088cc,#29b6f6)}
.ds{background:linear-gradient(135deg,#5865f2,#7983f5)}
.tw{background:linear-gradient(135deg,#9146ff,#772ce8)}
.st{background:linear-gradient(135deg,#1b2838,#35607f)}
.nm{background:linear-gradient(135deg,#43a047,#2e7d32)}
.rb{background:linear-gradient(135deg,#e53935,#b71c1c)}
.sp{background:linear-gradient(135deg,#1db954,#1ed760)}
@media (hover:hover){
  .tile:hover{transform:translateY(-4px);border-color:rgba(255,77,148,.55)}
  .tile:hover::before{opacity:1}
}

/* низ */
.foot{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:12px}
.copy{
  display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:99px;
  border:1px solid var(--line);background:var(--glass);color:var(--text);
  font:inherit;font-size:14px;cursor:pointer;transition:transform .15s,background .2s;
}
.copy:active{transform:scale(.95)}
.copy.done{background:linear-gradient(135deg,var(--pink),var(--violet));border-color:transparent}
.small{font-size:12px;color:var(--muted)}

/* появление после входа */
.wrap>*{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
body.in .wrap>*{opacity:1;transform:none}
body.in .wrap>*:nth-child(2){transition-delay:.15s}
body.in .wrap>*:nth-child(3){transition-delay:.3s}

@media (max-width:360px){
  h1{font-size:30px}
  .tile{padding:14px;min-height:104px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .wrap>*{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>

<button class="splash" id="splash" type="button" aria-label="Войти на страницу">
  <span class="splash-star">✦</span>
  <span class="splash-text">нажми, чтобы войти</span>
</button>

<main class="wrap">
  <section class="profile">
    <button class="avatar-btn" id="avatar" type="button" aria-label="Погладить кота">
      <img src="avatar.jpg" alt="Fin2282">
      <span class="badge" id="badge">0</span>
    </button>
    <h1>Fin2282</h1>
    <p class="tagline" id="tagline"></p>
    <p class="hint">нажми на аву — услышишь мяу</p>
  </section>

  <section class="grid">
    <a class="tile wide" href="https://t.me/fin228262" target="_blank" rel="noopener">
      <div class="ico tg"><i class="fab fa-telegram-plane"></i></div>
      <div><div class="name">Telegram</div><div class="sub">мой канал</div></div>
      <i class="fas fa-arrow-up-right-from-square go"></i>
    </a>
    <a class="tile" href="https://discord.gg/4fSm5RJmBc" target="_blank" rel="noopener">
      <div class="ico ds"><i class="fab fa-discord"></i></div>
      <div><div class="name">Discord</div><div class="sub">сервер</div></div>
    </a>
    <a class="tile" href="https://www.twitch.tv/fin2282" target="_blank" rel="noopener">
      <div class="ico tw"><i class="fab fa-twitch"></i></div>
      <div><div class="name">Twitch</div><div class="sub">стримы</div></div>
    </a>
    <a class="tile" href="https://steamcommunity.com/profiles/76561199257794657/" target="_blank" rel="noopener">
      <div class="ico st"><i class="fab fa-steam"></i></div>
      <div><div class="name">Steam</div><div class="sub">профиль</div></div>
    </a>
    <a class="tile" href="https://namemc.com/profile/Fin228_.1" target="_blank" rel="noopener">
      <div class="ico nm"><i class="fas fa-cube"></i></div>
      <div><div class="name">NameMC</div><div class="sub">Minecraft</div></div>
    </a>
    <a class="tile" href="https://www.roblox.com/users/1964600822/profile" target="_blank" rel="noopener">
      <div class="ico rb"><i class="fas fa-gamepad"></i></div>
      <div><div class="name">Roblox</div><div class="sub">профиль</div></div>
    </a>
    <a class="tile" href="https://open.spotify.com/user/31dk7cv27efjkp3k5yvdyligegge?si=834919aa8a7d42e8" target="_blank" rel="noopener">
      <div class="ico sp"><i class="fab fa-spotify"></i></div>
      <div><div class="name">Spotify</div><div class="sub">музыка</div></div>
    </a>
  </section>

  <footer class="foot">
    <button class="copy" id="copy" type="button"><i class="fas fa-link"></i><span>Скопировать ссылку</span></button>
    <p class="small">© Fin2282</p>
  </footer>
</main>

<audio id="meowSound" src="meowrgh.mp3" preload="auto"></audio>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // заставка
  var splash = $('splash');
  function enter() {
    splash.classList.add('hide');
    document.body.classList.add('in');
  }
  splash.addEventListener('click', enter);

  // печатающаяся подпись
  var phrases = ['Добро пожаловать :3', 'заходи, не стесняйся ✦', 'мяу? нажми на аву'];
  var tag = $('tagline'), p = 0, c = 0, del = false;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { tag.textContent = phrases[0]; }
  else {
    (function tick() {
      var s = phrases[p];
      tag.textContent = s.slice(0, c);
      var t = del ? 35 : 85;
      if (!del && c === s.length) { del = true; t = 1800; }
      else if (del && c === 0) { del = false; p = (p + 1) % phrases.length; t = 400; }
      else { c += del ? -1 : 1; }
      setTimeout(tick, t);
    })();
  }

  // счётчик мяу
  var audio = $('meowSound'), badge = $('badge'), count = 0;
  try { count = parseInt(localStorage.getItem('fin-meows'), 10) || 0; } catch (e) {}
  badge.textContent = count;
  $('avatar').addEventListener('click', function () {
    count++;
    badge.textContent = count;
    try { localStorage.setItem('fin-meows', count); } catch (e) {}
    badge.classList.add('pop');
    setTimeout(function () { badge.classList.remove('pop'); }, 160);
    try { audio.currentTime = 0; audio.play(); } catch (e) {}
    var m = document.createElement('span');
    m.className = 'meow';
    m.textContent = 'мяу!';
    m.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
    this.appendChild(m);
    setTimeout(function () { m.remove(); }, 900);
  });

  // подсветка плиток за курсором
  document.querySelectorAll('.tile').forEach(function (t) {
    t.addEventListener('pointermove', function (e) {
      var r = t.getBoundingClientRect();
      t.style.setProperty('--x', (e.clientX - r.left) + 'px');
      t.style.setProperty('--y', (e.clientY - r.top) + 'px');
    });
  });

  // копирование ссылки
  var copyBtn = $('copy');
  copyBtn.addEventListener('click', function () {
    var label = copyBtn.querySelector('span');
    function ok() {
      copyBtn.classList.add('done');
      label.textContent = 'Ссылка скопирована';
      setTimeout(function () {
        copyBtn.classList.remove('done');
        label.textContent = 'Скопировать ссылку';
      }, 1800);
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(location.href).then(ok, function () {});
    } else {
      var i = document.createElement('input');
      i.value = location.href;
      document.body.appendChild(i);
      i.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      i.remove();
    }
  });
})();
</script>
</body>
</html>
