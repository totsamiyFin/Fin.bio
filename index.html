<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0a14">
<title>Fin2282</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --pink-300: #ff99c2;
  --pink-400: #ff6b9d;
  --pink-500: #ff4081;
  --pink-600: #e91e63;
  --purple: #a855f7;
  --ink: #1a0a14;
  --muted: rgba(255,255,255,.55);
}

html { scroll-padding-bottom: 120px; }
body {
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  color: #fff;
  background:
    linear-gradient(135deg, rgba(26,10,20,.82) 0%, rgba(52,16,48,.78) 50%, rgba(26,10,20,.86) 100%),
    url('background.jpg') center / cover fixed;
  display: flex;
  justify-content: center;
  padding: 28px 16px calc(130px + env(safe-area-inset-bottom));
  overflow-x: hidden;
}

.container { width: 100%; max-width: 550px; position: relative; z-index: 1; }

/* ---------- шапка ---------- */
.head { display: flex; flex-direction: column; align-items: center; text-align: center; }

.avatar {
  position: relative; width: 170px; height: 170px; border-radius: 50%;
  padding: 5px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  background: linear-gradient(135deg, var(--pink-500), var(--purple));
  box-shadow: 0 0 40px rgba(255,64,129,.35);
}
.avatar-img {
  width: 100%; height: 100%; border-radius: 50%; display: block; object-fit: cover;
  border: 4px solid var(--ink); pointer-events: none;
}
.badge {
  position: absolute; right: 2px; bottom: 8px; min-width: 46px; padding: 3px 11px;
  border-radius: 999px; border: 3px solid var(--ink);
  background: linear-gradient(135deg, var(--purple), var(--pink-500));
  font: 700 17px/1.2 Georgia, 'Times New Roman', serif; text-align: center; pointer-events: none;
}

.username {
  margin-top: 22px; font-size: 44px; font-weight: 700; letter-spacing: -.5px;
  text-shadow: 0 0 24px rgba(255,64,129,.45);
}
.typer {
  margin-top: 6px; min-height: 30px; font-size: 22px; font-weight: 300; color: var(--pink-400);
}
.typer::after {
  content: ''; display: inline-block; width: 1px; height: 1em; margin-left: 2px;
  vertical-align: -.15em; background: var(--pink-400); animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ---------- ссылки ---------- */
.links { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.card {
  display: flex; text-decoration: none; color: #fff; position: relative;
  background: rgba(34,24,44,.42); border: 1px solid rgba(255,255,255,.1); border-radius: 24px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.card:hover { transform: translateY(-3px); border-color: rgba(255,64,129,.55); box-shadow: 0 10px 34px rgba(255,64,129,.18); }
.card:focus-visible { outline: 2px solid var(--pink-400); outline-offset: 3px; }

.card.sq { flex-direction: column; justify-content: space-between; gap: 34px; padding: 20px; min-height: 170px; }
.card.wide {
  grid-column: 1 / -1; align-items: center; gap: 22px; padding: 22px 24px;
  background: linear-gradient(135deg, rgba(255,64,129,.14), rgba(60,24,60,.4));
  border-color: rgba(255,64,129,.5);
}

.ico {
  width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center;
  font-size: 24px; flex-shrink: 0; color: #fff;
}
.wide .ico { width: 56px; height: 56px; }
.t { font-size: 19px; font-weight: 600; line-height: 1.2; }
.wide .t { font-size: 21px; }
.s { margin-top: 3px; font-size: 14px; font-weight: 400; color: var(--muted); }
.wide .txt { flex: 1; }
.ext { color: var(--pink-400); font-size: 20px; }

.i-tg { background: linear-gradient(135deg, #0a8fd8, #29b6f6); }
.i-dc { background: linear-gradient(135deg, #5865F2, #7b86ff); }
.i-tw { background: linear-gradient(135deg, #8a3ffc, #6a1fe0); }
.i-st { background: linear-gradient(135deg, #16283a, #2a5470); }
.i-nm { background: linear-gradient(135deg, #43a047, #2e7d32); }
.i-rb { background: linear-gradient(135deg, #e53935, #b71c1c); }
.i-sp { background: linear-gradient(135deg, #1db954, #1ed760); }

/* ---------- широкий плеер ---------- */
.player {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom)); width: min(760px, calc(100% - 24px));
  display: grid; grid-template-columns: 56px 1fr auto auto; align-items: center; gap: 18px;
  padding: 14px 20px; border-radius: 22px;
  background: rgba(26,10,20,.72); border: 1px solid rgba(255,64,129,.28);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 12px 40px rgba(0,0,0,.45), 0 0 30px rgba(255,64,129,.12);
}
.p-art {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  font-size: 20px; background: conic-gradient(from 0deg, var(--pink-500), var(--purple), var(--pink-500));
  box-shadow: 0 0 18px rgba(255,64,129,.4);
}
.p-art i { background: var(--ink); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; color: var(--pink-400); }
.player.playing .p-art { animation: spin 5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.p-info { min-width: 0; }
.p-meta { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
.p-title { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.p-artist { font-size: 13px; font-weight: 300; color: var(--pink-300); overflow: hidden; text-overflow: ellipsis; }
.p-prog { margin-top: 6px; display: flex; align-items: center; gap: 10px; }
.p-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 32px; }
.p-time:last-child { text-align: right; }
.p-bar { flex: 1; height: 22px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.p-track { width: 100%; height: 5px; border-radius: 5px; background: rgba(255,255,255,.14); position: relative; }
.p-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--pink-400), var(--pink-600)); box-shadow: 0 0 10px rgba(255,64,129,.6); }

.p-ctrls { display: flex; align-items: center; gap: 6px; }
.p-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: rgba(255,255,255,.85); font-size: 16px; cursor: pointer; transition: color .2s; }
.p-btn:hover { color: var(--pink-400); }
.p-play { width: 48px; height: 48px; font-size: 18px; color: #fff; background: linear-gradient(135deg, var(--pink-400), var(--pink-600)); box-shadow: 0 0 16px rgba(255,64,129,.4); }
.p-play:hover { color: #fff; filter: brightness(1.1); }
.p-btn:focus-visible, .p-bar:focus-visible, .avatar:focus-visible, .gate:focus-visible { outline: 2px solid var(--pink-400); outline-offset: 2px; }

.p-vol { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.p-vol input { width: 100px; accent-color: var(--pink-500); cursor: pointer; }

/* ---------- экран входа ---------- */
.gate {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; cursor: pointer;
  background: rgba(26,10,20,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  color: var(--pink-300); font-size: 14px; font-weight: 300; letter-spacing: 1px;
  transition: opacity .6s ease, visibility .6s;
}
.gate i { font-size: 26px; color: var(--pink-400); text-shadow: 0 0 20px rgba(255,64,129,.7); animation: pulse 2.4s ease-in-out infinite; }
.gate.hide { opacity: 0; visibility: hidden; }
@keyframes pulse { 0%, 100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }

/* ---------- телефон ---------- */
@media (max-width: 560px) {
  body { padding: 22px 14px calc(120px + env(safe-area-inset-bottom)); }
  .avatar { width: 150px; height: 150px; }
  .username { font-size: 38px; }
  .typer { font-size: 19px; }
  .links { gap: 12px; }
  .card { border-radius: 20px; }
  .card.sq { padding: 16px; min-height: 150px; gap: 26px; }
  .card.wide { padding: 18px; gap: 16px; }
  .player { grid-template-columns: 46px 1fr auto; gap: 12px; padding: 12px 14px; border-radius: 20px; }
  .p-art { width: 46px; height: 46px; }
  .p-vol { display: none; }
  .p-btn { width: 36px; height: 36px; }
  .p-play { width: 44px; height: 44px; }
  .p-ctrls { gap: 2px; grid-column: 3; grid-row: 1; }
  .p-info { display: contents; }
  .p-meta { grid-column: 2; grid-row: 1; }
  .p-prog { grid-column: 1 / -1; grid-row: 2; margin-top: 0; }
  .p-art { grid-row: 1; }
  body { padding-bottom: calc(140px + env(safe-area-inset-bottom)); }
}
@media (max-width: 380px) {
  .p-ctrls .p-prev { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="gate" id="gate" role="button" tabindex="0" aria-label="Войти на сайт">
  <i class="fas fa-star-of-life"></i>
  <span>нажми, чтобы войти</span>
</div>

<main class="container">
  <header class="head">
    <div class="avatar" id="avatar" role="button" tabindex="0" aria-label="Аватар">
      <img class="avatar-img" src="avatar.jpg" alt="Fin2282">
      <span class="badge">62</span>
    </div>
    <h1 class="username">Fin2282</h1>
    <p class="typer" id="typer" aria-label="Добро пожаловать :3"></p>
  </header>

  <nav class="links">
    <a class="card wide" href="https://t.me/fin228262" target="_blank" rel="noopener">
      <div class="ico i-tg"><i class="fab fa-telegram-plane"></i></div>
      <div class="txt"><div class="t">Telegram</div><div class="s">мой канал</div></div>
      <i class="fas fa-arrow-up-right-from-square ext"></i>
    </a>
    <a class="card sq" href="https://discord.gg/4fSm5RJmBc" target="_blank" rel="noopener">
      <div class="ico i-dc"><i class="fab fa-discord"></i></div>
      <div><div class="t">Discord</div><div class="s">сервер</div></div>
    </a>
    <a class="card sq" href="https://www.twitch.tv/fin2282" target="_blank" rel="noopener">
      <div class="ico i-tw"><i class="fab fa-twitch"></i></div>
      <div><div class="t">Twitch</div><div class="s">стримы</div></div>
    </a>
    <a class="card sq" href="https://steamcommunity.com/profiles/76561199257794657/" target="_blank" rel="noopener">
      <div class="ico i-st"><i class="fab fa-steam"></i></div>
      <div><div class="t">Steam</div><div class="s">профиль</div></div>
    </a>
    <a class="card sq" href="https://namemc.com/profile/Fin228_.1" target="_blank" rel="noopener">
      <div class="ico i-nm"><i class="fas fa-cube"></i></div>
      <div><div class="t">NameMC</div><div class="s">Minecraft</div></div>
    </a>
    <a class="card sq" href="https://www.roblox.com/users/1964600822/profile" target="_blank" rel="noopener">
      <div class="ico i-rb"><i class="fas fa-gamepad"></i></div>
      <div><div class="t">Roblox</div><div class="s">профиль</div></div>
    </a>
    <a class="card sq" href="https://open.spotify.com/user/31dk7cv27efjkp3k5yvdyligegge?si=834919aa8a7d42e8" target="_blank" rel="noopener">
      <div class="ico i-sp"><i class="fab fa-spotify"></i></div>
      <div><div class="t">Spotify</div><div class="s">музыка</div></div>
    </a>
  </nav>
</main>

<div class="player" id="player" aria-label="Музыкальный плеер">
  <div class="p-art"><i class="fas fa-music"></i></div>
  <div class="p-info">
    <div class="p-meta"><span class="p-title" id="pTitle">Safe Room</span><span class="p-artist" id="pArtist">nicopatty</span></div>
    <div class="p-prog">
      <span class="p-time" id="pCur">0:00</span>
      <div class="p-bar" id="pBar" tabindex="0" role="slider" aria-label="Перемотка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="p-track"><div class="p-fill" id="pFill"></div></div></div>
      <span class="p-time" id="pDur">0:00</span>
    </div>
  </div>
  <div class="p-ctrls">
    <button class="p-btn p-prev" id="pPrev" aria-label="Предыдущий трек"><i class="fas fa-backward-step"></i></button>
    <button class="p-btn p-play" id="pPlay" aria-label="Играть / пауза"><i class="fas fa-play" id="pPlayIcon"></i></button>
    <button class="p-btn" id="pNext" aria-label="Следующий трек"><i class="fas fa-forward-step"></i></button>
  </div>
  <div class="p-vol">
    <i class="fas fa-volume-low"></i>
    <input type="range" id="pVol" min="0" max="1" step="0.01" value="0.2" aria-label="Громкость">
  </div>
</div>

<audio id="music" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);

/* ===== Музыка ===== */
const TRACKS = [
  { title: 'Safe Room',            artist: 'nicopatty',  src: 'safe-room.mp3' },
  { title: 'Shop',                 artist: 'nicopatty',  src: 'shop.mp3' },
  { title: 'Dead Internet Theory', artist: 'ZWE1HVNDXR', src: 'dead-internet-theory.mp3' }
];
const START_VOLUME = 0.2; // тихий фон при входе (0–1)

const music = $('music');
let idx = 0, failed = 0;
music.volume = START_VOLUME;
$('pVol').value = START_VOLUME;

const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';

function loadTrack(i, autoplay) {
  idx = (i + TRACKS.length) % TRACKS.length;
  const t = TRACKS[idx];
  music.src = encodeURI(t.src);
  music.load();
  $('pTitle').textContent = t.title;
  $('pArtist').textContent = t.artist;
  $('pCur').textContent = '0:00';
  $('pDur').textContent = '0:00';
  $('pFill').style.width = '0%';
  if (autoplay) music.play().catch(() => {});
}
function syncPlayState() {
  $('pPlayIcon').className = music.paused ? 'fas fa-play' : 'fas fa-pause';
  $('player').classList.toggle('playing', !music.paused);
}

$('pPlay').onclick = () => (music.paused ? music.play().catch(() => {}) : music.pause());
$('pPrev').onclick = () => loadTrack(idx - 1, true);
$('pNext').onclick = () => loadTrack(idx + 1, true);
$('pVol').oninput = e => { music.volume = +e.target.value; };

music.addEventListener('play', syncPlayState);
music.addEventListener('pause', syncPlayState);
music.addEventListener('playing', () => { failed = 0; });
music.addEventListener('ended', () => loadTrack(idx + 1, true));
music.addEventListener('loadedmetadata', () => { $('pDur').textContent = fmt(music.duration); });
music.addEventListener('timeupdate', () => {
  const p = music.duration ? (music.currentTime / music.duration) * 100 : 0;
  $('pFill').style.width = p + '%';
  $('pBar').setAttribute('aria-valuenow', Math.round(p));
  $('pCur').textContent = fmt(music.currentTime);
});
// если файл не найден — показываем это в плеере и пробуем следующий трек
music.addEventListener('error', () => {
  $('pTitle').textContent = 'Не удалось загрузить';
  $('pArtist').textContent = TRACKS[idx].src;
  if (++failed < TRACKS.length) setTimeout(() => loadTrack(idx + 1, true), 1200);
});

function seek(e) {
  const r = $('pBar').getBoundingClientRect();
  const x = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  if (music.duration) music.currentTime = x * music.duration;
}
let dragging = false;
$('pBar').addEventListener('pointerdown', e => { dragging = true; seek(e); });
window.addEventListener('pointermove', e => { if (dragging) seek(e); });
window.addEventListener('pointerup', () => { dragging = false; });
$('pBar').addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') music.currentTime = Math.min(music.currentTime + 5, music.duration || 0);
  if (e.key === 'ArrowLeft') music.currentTime = Math.max(music.currentTime - 5, 0);
});
loadTrack(0, false);

/* ===== Мяу без задержки (Web Audio) ===== */
const ctx = new (window.AudioContext || window.webkitAudioContext)();
let meowBuf = null, meowStart = 0;
const fallback = new Audio('meowrgh.mp3');
fallback.preload = 'auto';

fetch('meowrgh.mp3')
  .then(r => r.arrayBuffer())
  .then(ab => ctx.decodeAudioData(ab))
  .then(buf => {
    meowBuf = buf;
    const d = buf.getChannelData(0);
    let i = 0;
    while (i < d.length && Math.abs(d[i]) < 0.01) i++; // срезаем тишину в начале
    meowStart = Math.max(0, i - buf.sampleRate * 0.005) / buf.sampleRate;
  })
  .catch(() => {});

function meow() {
  if (ctx.state === 'suspended') ctx.resume();
  if (meowBuf) {
    const src = ctx.createBufferSource();
    src.buffer = meowBuf;
    src.connect(ctx.destination);
    src.start(0, meowStart);
  } else {
    fallback.currentTime = 0;
    fallback.play().catch(() => {});
  }
}
$('avatar').addEventListener('pointerdown', meow);
$('avatar').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); meow(); } });

/* ===== Вход: клик запускает музыку ===== */
const gate = $('gate');
function enter() {
  if (ctx.state === 'suspended') ctx.resume();
  music.play().catch(() => {});
  gate.classList.add('hide');
}
gate.addEventListener('pointerdown', enter, { once: true });
gate.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });

/* ===== Печатающаяся строка ===== */
const PHRASE = 'Добро пожаловать :3';
const typer = $('typer');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let n = 0, dir = 1;
function tick() {
  n += dir;
  typer.textContent = PHRASE.slice(0, n);
  if (n === PHRASE.length) { dir = -1; return setTimeout(tick, 2600); }
  if (n === 0) { dir = 1; return setTimeout(tick, 600); }
  setTimeout(tick, dir === 1 ? 110 : 45);
}
if (still) typer.textContent = PHRASE; else tick();
</script>
</body>
